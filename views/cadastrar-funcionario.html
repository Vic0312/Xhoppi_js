<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link rel="icon" href="/img/logo.png" type="image/png">
    <title>Xhopii - Cadastro Funcionario</title>
</head>
<body>

    <header>
        <section id="cabecalho-logo">
            <img src="/img/logo.png">
            <h1>Xhopii</h1>
        </section>
        <section id="cabecalho-logout">
            <a href="/login">Sair</a>
        </section>
    </header>

    <nav class="menu-horizontal">
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/clientes/cadastrar">Cadastro Cliente</a></li>
            <li><a href="/funcionario/cadastrar">Cadastro Funcionário</a></li>
            <li><a href="/produto/cadastrar">Cadastro Produto</a></li>
            <li><a href="/clientes">Ver Clientes</a></li>
            <li><a href="#">Ver Funcionários</a></li>
            <li><a href="#">Ver Produtos</a></li>
        </ul>
    </nav>

    <section class="conteudo-cadastro">
        <section class="conteudo-formulario-cadastro">
            <form method="POST" action="/funcionario/cadastrar" enctype="multipart/form-data">
                <label>Cadastrar Funcionário</label>
                <input type="text" placeholder="Nome" name="inputNomeFunc" required>
                <input type="text" placeholder="Sobrenome" name="inputSobrenomeFunc" required>
                <input type="text" placeholder="CPF" name="inputCPFFunc" required>
                <input type="date" placeholder="Data Nascimento" name="inputDataNascFunc" required>
                <input type="text" placeholder="Telefone" name="inputTelefoneFunc">
                <input type="text" placeholder="Cargo / Função" name="inputCargoFunc">
                <input type="text" placeholder="Salário" name="inputSalarioFunc">
                <input type="text" placeholder="Email" name="inputEmailFunc" required>
                <input type="password" placeholder="Senha" name="inputSenha" required>
                <label id="lbl-arquivo" for="files">Selecionar foto de perfil:</label>
                <input type="file" name="inputFoto">
                <input id="botao" type="submit" value="Cadastrar">
            </form>
        </section>
    </section>

    <footer class="rodape">
        <hr>
        <p>© 2025 Xhopii. Todos os direitos acadêmicos reservados</p>
    </footer>

</body>
</html>
