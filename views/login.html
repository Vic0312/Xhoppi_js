<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="/css/style.css">
    <link rel="icon" href="/img/logo.png" type="image/png">
    <title>Xhopii - Login</title>
</head>
<body>
    
    <header class="cabecalho-login">
        <section id="cabecalho-login-logo">
            <img src="/img/logo.png">
            <h1>Xhopii</h1>
            <p>Entre</p>
        </section>
        <section id="cabecalho-login-ajuda">
            <p>Precisa de ajuda?</p>
        </section>
    </header>

    <section class="conteudo-login">
        <section class="conteudo-login-info">
            <form class="form-login" method="POST" action="/login">
                <label id="label-log">Login</label>
                <input id="input-log" type="text" placeholder="Email ou CPF" name="user" required>
                <input id="input-log" type="password" placeholder="Senha" name="senha" required>
                <input id="botao-log" type="submit" value="ENTRE">
            </form>
            <section class="conteudo-login-recuperacao">
                <a href="#">Esqueci minha senha</a>
                <a href="#">Fazer login com SMS</a>
            </section>
            <p>Novo na Xhopii? <a href="/clientes/cadastrar">Cadastrar</a></p>
        </section>
    </section>

    <footer class="rodape">
        <hr>
        <p>© 2025 Xhopii. Todos os direitos acadêmicos reservados</p>
    </footer>

</body>
</html>
